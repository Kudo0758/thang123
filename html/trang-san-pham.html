<!DOCTYPE html>
<html lang="vi">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Danh sách sản phẩm — Cổ Điển Boutique</title>
  <link rel="stylesheet" href="../css/products.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Cổ Điển Boutique</div>
      <div class="cart">Giỏ: <span id="cartCount">0</span> sp</div>
    </header>

    <p><a href="../index.html">← Trang chủ</a></p>

    <main>
      <h2>Danh mục sản phẩm</h2>
      <div class="grid">
        <div class="card" data-id="p1">
          <a href="trang-chi-tiet.html"><img src="../assets/images/product1.jpg" alt="Váy Vintage Linen"></a>
          <h3><a href="trang-chi-tiet.html">Váy Vintage Linen</a></h3>
          <div class="price">₫1.250.000</div>
          <div class="actions">
            <input class="qty" type="number" value="1" min="1">
            <button class="add-btn" data-id="p1" data-name="Váy Vintage Linen" data-price="1250000">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="card" data-id="p2">
          <a href="trang-chi-tiet.html"><img src="../assets/images/product2.jpg" alt="Áo sơ mi cổ điển"></a>
          <h3><a href="trang-chi-tiet.html">Áo sơ mi cổ điển</a></h3>
          <div class="price">₫680.000</div>
          <div class="actions">
            <input class="qty" type="number" value="1" min="1">
            <button class="add-btn" data-id="p2" data-name="Áo sơ mi cổ điển" data-price="680000">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="card" data-id="p3">
          <a href="trang-chi-tiet.html"><img src="../assets/images/product3.jpg" alt="Khăn lụa cổ điển"></a>
          <h3><a href="trang-chi-tiet.html">Khăn lụa cổ điển</a></h3>
          <div class="price">₫320.000</div>
          <div class="actions">
            <input class="qty" type="number" value="1" min="1">
            <button class="add-btn" data-id="p3" data-name="Khăn lụa cổ điển" data-price="320000">Thêm vào giỏ</button>
          </div>
        </div>
      </div>
    </main>

  </div>
  <script src="../js/cart.js"></script>
</body>
</html>
