<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Danh sách sản phẩm — Cổ Điển Boutique</title>
  <style>
    body{font-family: Georgia, 'Times New Roman', Times, serif;background:#fbf6f0;color:#3b2f2f;margin:0;padding:20px}
    .container{max-width:1100px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .logo{font-size:24px}
    .cart{font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{background:#fff8f1;padding:14px;border:1px solid rgba(0,0,0,0.04)}
    .card img{width:100%;height:180px;object-fit:cover;display:block}
    .card h3{margin:10px 0 6px 0;font-size:18px}
    .price{color:#b07b33;font-weight:700}
    .card .actions{display:flex;gap:8px;align-items:center;margin-top:8px}
    .card input.qty{width:56px;padding:6px}
    .add-btn{background:#b07b33;color:#fff;border:none;padding:8px 10px;cursor:pointer}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Cổ Điển Boutique</div>
      <div class="cart">Giỏ: <span id="cartCount">0</span> sp</div>
    </header>

    <main>
      <h2>Danh mục sản phẩm</h2>
      <div class="grid">
        <div class="card" data-id="p1">
          <img src="../assets/images/product1.jpg" alt="Váy Vintage Linen">
          <h3>Váy Vintage Linen</h3>
          <div class="price">₫1.250.000</div>
          <div class="actions">
            <input class="qty" type="number" value="1" min="1">
            <button class="add-btn" data-id="p1" data-name="Váy Vintage Linen" data-price="1250000">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="card" data-id="p2">
          <img src="../assets/images/product2.jpg" alt="Áo sơ mi cổ điển">
          <h3>Áo sơ mi cổ điển</h3>
          <div class="price">₫680.000</div>
          <div class="actions">
            <input class="qty" type="number" value="1" min="1">
            <button class="add-btn" data-id="p2" data-name="Áo sơ mi cổ điển" data-price="680000">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="card" data-id="p3">
          <img src="../assets/images/product3.jpg" alt="Khăn lụa cổ điển">
          <h3>Khăn lụa cổ điển</h3>
          <div class="price">₫320.000</div>
          <div class="actions">
            <input class="qty" type="number" value="1" min="1">
            <button class="add-btn" data-id="p3" data-name="Khăn lụa cổ điển" data-price="320000">Thêm vào giỏ</button>
          </div>
        </div>
      </div>
    </main>

  </div>
  <script src="../js/cart.js"></script>
</body>
</html>
